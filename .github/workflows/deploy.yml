name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Parse phase documents → events.json
        run: npm run parse-phases

      - name: Run property-based tests
        run: npm run test:run

      - name: Build SvelteKit static site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          test -f build/index.html && echo "✓ index.html exists"
          test -f build/404.html && echo "✓ 404.html exists"
          test -f build/favicon.png && echo "✓ favicon.png exists"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          force_orphan: true
