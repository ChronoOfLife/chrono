name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Parse phase documents → events.json / data.json
        run: |
          npm run parse-phases
          cp src/lib/data/events.json data.json

      - name: Run property-based tests
        run: npm run test:run

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp engine.js dist/engine.js
          cp data.json dist/data.json
          cp static/favicon.png dist/favicon.png
          # Create 404.html that redirects to index
          cp index.html dist/404.html
          # Required for GitHub Pages to serve _app assets without Jekyll processing
          touch dist/.nojekyll

      - name: Verify build output
        run: |
          test -f dist/index.html && echo "✓ index.html exists"
          test -f dist/engine.js  && echo "✓ engine.js exists"
          test -f dist/data.json  && echo "✓ data.json exists"
          python3 -c "import json; d=json.load(open('dist/data.json')); print(f'✓ {len(d)} events in data.json')"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
