<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chronology of Life — interactive timeline from Big Bang to Heat Death">
  <title>Chrono of Life</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin:0; padding:0; background:#05070f; overflow:hidden; font-family:system-ui,-apple-system,sans-serif; }
    canvas { display:block; cursor:grab; touch-action:none; user-select:none; }
    canvas:active { cursor:grabbing; }

    #panel {
      display:none; position:fixed; z-index:200;
      background:#1a1f2e; border:1px solid rgba(255,255,255,0.15);
      border-radius:12px; padding:16px; color:#e8eaf6;
      box-shadow:0 8px 40px rgba(0,0,0,0.8);
      max-height:75vh; overflow-y:auto;
    }
    @media(max-width:600px){
      #panel{ left:0!important;right:0!important;bottom:0!important;
              top:auto!important;width:100%!important;
              border-radius:16px 16px 0 0;max-height:55vh; }
    }
    #panel-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; }
    #panel-title  { font-size:15px; font-weight:700; color:#fff; margin:0; flex:1; padding-right:8px; line-height:1.3; }
    #panel-time   { font-size:11px; color:#90caf9; margin:0 0 10px; }
    #panel-close  { background:none; border:none; color:rgba(255,255,255,0.4); cursor:pointer; font-size:18px; padding:0 4px; min-width:32px; min-height:32px; }
    #panel-close:hover { color:#fff; }
    #panel-body   { font-size:13px; line-height:1.65; color:#b0bec5; }
    #panel-body img { width:100%; max-height:130px; object-fit:cover; border-radius:8px; margin-bottom:10px; }
    #panel-body p { margin:0 0 8px; }
    .india-note   { color:#FF9933!important; }
    #panel-link   { display:none; color:#64b5f6; font-size:12px; font-weight:600; text-decoration:none;
                    margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.1); }
    #panel-link:hover { text-decoration:underline; }

    #loading { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
               color:rgba(255,255,255,0.4); font-size:14px; pointer-events:none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="panel">
    <div id="panel-header">
      <h2 id="panel-title"></h2>
      <button id="panel-close" aria-label="Close">✕</button>
    </div>
    <p id="panel-time"></p>
    <div id="panel-body"></div>
    <a id="panel-link" target="_blank" rel="noopener noreferrer">Read more on Wikipedia ↗</a>
  </div>

  <div id="loading">Loading 1700+ events…</div>
  <script src="engine.js"></script>
</body>
</html>
