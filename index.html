<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrono of Life</title>
  <link rel="icon" href="favicon.png">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      background:#05070f;color:#e8eaf6;
      font-family:system-ui,-apple-system,sans-serif;
      overflow-x:hidden;
    }

    /* ── HUD ─────────────────────────────────────────────────────────── */
    #hud{
      position:fixed;top:0;left:0;right:0;z-index:200;height:52px;
      background:rgba(5,7,15,0.92);backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.07);
      display:flex;align-items:center;padding:0 16px;gap:10px;
    }
    #hud-time{font-size:16px;font-weight:700;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    #hud-age{font-size:11px;padding:3px 12px;border-radius:12px;background:rgba(100,181,246,0.15);color:#90caf9;white-space:nowrap;}
    .hbtn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:#e8eaf6;border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer;white-space:nowrap;transition:background .15s;}
    .hbtn:hover{background:rgba(255,255,255,0.14);}
    .hbtn.on{background:rgba(255,153,51,.22);border-color:#FF9933;color:#FF9933;}
    #prog{position:fixed;top:52px;left:0;height:2px;background:linear-gradient(90deg,#64b5f6,#FF9933);z-index:201;pointer-events:none;transition:width .1s;}

    /* ── Scroll world ────────────────────────────────────────────────── */
    #world{padding-top:52px;}

    /* ── Era section ─────────────────────────────────────────────────── */
    .era{
      position:relative;
      transition:background 1s ease;
    }

    /* ── Sticky era label ────────────────────────────────────────────── */
    .era-label{
      position:sticky;top:52px;z-index:100;
      padding:8px 0;text-align:center;pointer-events:none;
    }
    .era-label-inner{
      display:inline-flex;align-items:center;gap:10px;
      background:rgba(5,7,15,0.8);backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,0.1);border-radius:20px;
      padding:6px 20px;
    }
    .era-label-time{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.5px;}
    .era-label-name{font-size:11px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:.08em;}

    /* ── Column layout ───────────────────────────────────────────────── */
    .col-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:0;
      padding:20px 8px 40px;
      position:relative;
    }
    /* Subtle column separators */
    .col-grid::before{
      content:'';position:absolute;inset:0;
      background:repeating-linear-gradient(
        90deg,
        transparent,
        transparent calc(100%/7 - 1px),
        rgba(255,255,255,0.03) calc(100%/7 - 1px),
        rgba(255,255,255,0.03) calc(100%/7)
      );
      pointer-events:none;
    }

    /* ── Column header ───────────────────────────────────────────────── */
    .col-hdr{
      text-align:center;font-size:9px;font-weight:700;
      text-transform:uppercase;letter-spacing:.08em;
      padding:4px 2px 8px;opacity:.45;
    }

    /* ── Event card ──────────────────────────────────────────────────── */
    .ev{
      margin:4px 4px 8px;
      padding:7px 8px;
      border-radius:8px;
      cursor:pointer;
      transition:background .12s, transform .12s;
      border-left:3px solid transparent;
      opacity:0;
      transform:translateY(12px);
      animation:fadeUp .4s ease forwards;
    }
    @keyframes fadeUp{
      to{opacity:1;transform:translateY(0);}
    }
    .ev:hover{background:rgba(255,255,255,0.07);transform:translateY(-1px);}
    .ev.dimmed{opacity:.1!important;}

    .ev-dot{
      display:inline-block;width:8px;height:8px;border-radius:50%;
      margin-right:5px;vertical-align:middle;flex-shrink:0;
    }
    .ev-title{
      font-size:11px;font-weight:600;color:#e8eaf6;
      line-height:1.35;display:inline;vertical-align:middle;
    }
    .ev-sub{
      font-size:9px;color:rgba(255,255,255,0.35);
      margin-top:3px;line-height:1.3;
      display:-webkit-box;-webkit-line-clamp:2;
      -webkit-box-orient:vertical;overflow:hidden;
    }

    /* ── Age milestone ───────────────────────────────────────────────── */
    .milestone{
      grid-column:1/-1;
      display:flex;align-items:center;gap:0;
      padding:12px 0 8px;
    }
    .milestone-line{flex:1;height:1px;background:rgba(255,255,255,0.1);}
    .milestone-text{
      padding:4px 16px;font-size:10px;font-weight:700;
      color:rgba(255,255,255,0.45);text-transform:uppercase;
      letter-spacing:.08em;white-space:nowrap;
    }

    /* ── Detail panel ────────────────────────────────────────────────── */
    #panel{
      display:none;position:fixed;z-index:300;
      top:64px;right:12px;width:340px;max-height:80vh;overflow-y:auto;
      background:#1a1f2e;border:1px solid rgba(255,255,255,0.15);
      border-radius:12px;padding:16px;box-shadow:0 8px 40px rgba(0,0,0,.8);
    }
    @media(max-width:600px){
      #panel{left:0;right:0;bottom:0;top:auto;width:100%;border-radius:16px 16px 0 0;max-height:60vh;}
    }
    #ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
    #pt{font-size:15px;font-weight:700;color:#fff;margin:0;flex:1;padding-right:8px;line-height:1.3;}
    #ptime{font-size:11px;color:#90caf9;margin:0 0 10px;}
    #pc{background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:18px;padding:0 4px;}
    #pc:hover{color:#fff;}
    #pb{font-size:13px;line-height:1.65;color:#b0bec5;}
    #pb img{width:100%;max-height:130px;object-fit:cover;border-radius:8px;margin-bottom:10px;}
    #pb p{margin:0 0 8px;}
    .in{color:#FF9933!important;}
    #pl{display:none;color:#64b5f6;font-size:12px;font-weight:600;text-decoration:none;
        margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);}
    #pl:hover{text-decoration:underline;}

    /* ── Loading ─────────────────────────────────────────────────────── */
    #loading{
      position:fixed;inset:0;z-index:500;background:#05070f;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    }
    #loading h1{font-size:28px;color:#fff;font-weight:300;letter-spacing:-1px;}
    #loading p{font-size:14px;color:rgba(255,255,255,.4);}
    #lbar{width:220px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
    #lfill{height:100%;background:#64b5f6;width:0%;transition:width .3s;border-radius:2px;}

    /* ── End cap ─────────────────────────────────────────────────────── */
    #endcap{
      text-align:center;padding:80px 20px 120px;
      color:rgba(255,255,255,.2);font-size:14px;
      background:linear-gradient(to bottom,transparent,#000);
    }
    #endcap .big{font-size:40px;margin-bottom:12px;opacity:.4;}
  </style>
</head>
<body>

<div id="loading">
  <h1>Chrono of Life</h1>
  <p>13.8 billion years of history…</p>
  <div id="lbar"><div id="lfill"></div></div>
</div>

<div id="hud">
  <div id="hud-time">Big Bang</div>
  <div id="hud-age">Planck Epoch</div>
  <button class="hbtn" id="btn-india">🇮�� India</button>
  <button class="hbtn" id="btn-top">⌂ Start</button>
</div>
<div id="prog"></div>

<div id="world"></div>

<div id="panel">
  <div id="ph"><h2 id="pt"></h2><button id="pc">✕</button></div>
  <p id="ptime"></p>
  <div id="pb"></div>
  <a id="pl" target="_blank" rel="noopener noreferrer">Read more on Wikipedia ↗</a>
</div>

<script src="engine.js"></script>
</body>
</html>
